name: CI

on:
  push:
    branches-ignore: ["deploy/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:php
      - run: npm run build
      - run: npm run package
      # Offline: CI never contacts the live store.
      - run: npx tsx tools/import/src/cli.ts plan --offline
